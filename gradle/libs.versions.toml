[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
coreKtx = "1.19.1"
appcompat = "1.8.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
hilt = "2.60.1"
hiltAndroidx = "1.4.0"
coroutines = "1.11.0"
serialization = "1.12.0"
zxing = "3.5.4"
